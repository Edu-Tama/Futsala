<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Identidad club */
  --verde:#2F8A5B; --verde-cl:#7FD1A6; --rojo:#FF5A5A; --rojoBg:#D63A46; --ambar:#E9B44C;
  /* Superficies (mismo lenguaje que la app del cuerpo técnico) */
  --papel:#0B1220; --card:#131C2E; --card2:#1A2438; --linea:#26324B;
  --tinta:#E9EFF8; --sub:#9AAAC2; --verde-osc:#7FD1A6; --crema:#1A2438;
  --sombra:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35); --navBg:rgba(19,28,46,.92);
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  /* Pictogramas */
  --svgInk:#E9EFF8; --svgFar:#4E6C88; --svgAcc:#FF5A5A; --svgProp:#7C8DA8; --svgPropF:#222E47; --svgGround:#2A3A4B;
}
/* Pictogramas */
.si,.sf,.sp,.sa,.sg{fill:none}
.si{stroke:var(--svgInk)} .sf{stroke:var(--svgFar)} .sa{stroke:var(--svgAcc)}
.sp{stroke:var(--svgProp)} .sg{stroke:var(--svgGround)}
.sh{fill:var(--svgInk);stroke:none}
.spf{fill:var(--svgPropF);stroke:var(--svgProp)}
.balonSvg circle{fill:var(--card);stroke:var(--verde-cl)}
.balonSvg polygon{fill:var(--verde-cl)}
/* Iconos de interfaz */
.ui{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{color:var(--tinta);font-family:inherit}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{font-family:var(--body);background:var(--papel);color:var(--tinta);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
/* ---------- cabecera ---------- */
header{background:linear-gradient(160deg,#123A2A,#0B1220 70%);color:#fff;padding:10px 0 12px;position:relative;overflow:hidden}
header .wrap{display:flex;align-items:center;gap:12px}

header img{width:46px;height:46px;border-radius:50%;background:#fff;flex:none}
header h1{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
header p{font-size:12.5px;opacity:.85;margin-top:2px}
.rojo-line{height:2px;background:linear-gradient(90deg,var(--verde),var(--rojo))}
/* ---------- tabs inferiores ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navBg);backdrop-filter:blur(12px);border-top:1px solid var(--linea);
  display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;font-family:var(--disp);font-weight:700;
  font-size:12.5px;letter-spacing:.6px;color:var(--sub);text-transform:uppercase;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--verde-cl)}
nav button.on .ui{stroke:var(--verde-cl)}
nav button.on:after{content:"";position:absolute;bottom:calc(6px + env(safe-area-inset-bottom));width:22px;height:3px;border-radius:2px;background:var(--verde-cl)}
nav button{position:relative}
/* ---------- tarjetas ---------- */
.card{background:var(--card);border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra);padding:16px;margin:14px 0}
.card h2{font-family:var(--disp);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.4px;color:var(--verde-osc)}
.card h3{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.3px;color:var(--verde-osc);text-transform:uppercase}
.sub{color:var(--sub);font-size:13.5px}
.tag{display:inline-block;background:rgba(127,209,166,.14);color:var(--verde-cl);font-family:var(--disp);font-weight:700;
  font-size:13px;letter-spacing:.5px;text-transform:uppercase;border-radius:6px;padding:2px 8px}
.tag.rojo{background:rgba(255,90,90,.15);color:var(--rojo)}
.tag.ambar{background:rgba(233,180,76,.15);color:var(--ambar)}
/* marcador del día (firma) */
.marcador{display:flex;align-items:stretch;gap:0;background:linear-gradient(135deg,#16543C,#132339);border:1px solid var(--linea);border-radius:14px;overflow:hidden;margin:14px 0 4px;box-shadow:var(--sombra)}
.marcador .num{background:var(--rojoBg);color:#fff;font-family:var(--disp);font-weight:800;font-size:44px;
  line-height:1;padding:12px 16px;display:flex;align-items:center}
.marcador .info{color:#fff;padding:10px 14px;flex:1}
.marcador .info .dia{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.6px;text-transform:uppercase}
.marcador .info .per{font-size:12.5px;opacity:.85}
/* línea de pista (progreso) */
.pista{position:relative;height:26px;margin:10px 0 2px}
.pista .base{position:absolute;left:0;right:0;top:11px;height:4px;background:var(--card2);border-radius:2px}
.pista .fill{position:absolute;left:0;top:11px;height:4px;background:linear-gradient(90deg,var(--verde),var(--verde-cl));border-radius:2px;transition:width .35s}
.pista .balon{position:absolute;top:2px;width:22px;height:22px;transition:left .35s;transform:translateX(-11px)}
.pista .meta{position:absolute;right:0;top:4px;width:4px;height:18px;background:var(--rojo);border-radius:2px}
/* bloques de sesión */
.bloque{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--linea);align-items:flex-start}
.bloque:first-of-type{border-top:0}
.chk{flex:none;width:30px;height:30px;border:2.5px solid var(--verde);border-radius:9px;background:var(--card2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:transparent;margin-top:2px}
.bloque.hecho .chk{background:var(--verde-cl);border-color:var(--verde-cl);color:#0B1220}
.bloque.hecho .bt{text-decoration:line-through;text-decoration-color:var(--sub);color:var(--sub);opacity:.75}
.bc{flex:1}
.bt{font-weight:600;font-size:16px}
.bd{font-size:14px;color:var(--sub);margin-top:3px;white-space:pre-line}
.bd b{color:var(--tinta)}
.acciones{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{font-family:var(--disp);font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:14.5px;
  border:0;border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn .ui{width:18px;height:18px}
.btn.verde{background:var(--verde);color:#fff}
.btn.rojo{background:var(--rojoBg);color:#fff}
.btn.borde{background:transparent;color:var(--verde-osc);border:1.5px solid var(--verde)}
.btn.gris{background:var(--card2);color:var(--tinta);border:1px solid var(--linea)}
.btn:disabled{opacity:.45;filter:grayscale(.3)}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.btn-lg{width:100%;padding:13px;font-size:17px}
/* escala balones */
.balones{display:flex;gap:10px;justify-content:center;margin:10px 0}
.balones button{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--linea);background:var(--card2);
  font-family:var(--disp);font-weight:800;font-size:20px;color:#9db5a5;cursor:pointer}
.balones button.on{border-color:var(--verde);background:var(--verde);color:#fff}
/* opciones test / formularios */
.ops{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ops button,.ops label{border:1.5px solid var(--linea);border-radius:10px;background:var(--card2);padding:11px 13px;
  font-size:15px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;
  color:var(--tinta);font-family:var(--body)}
.ops button:hover{border-color:var(--verde)}
.ops .on{border-color:var(--verde-cl);background:rgba(127,209,166,.12);color:var(--verde-cl);font-weight:600}
.ops input{width:19px;height:19px;accent-color:var(--verde)}
input[type=text],input[type=number]{width:100%;border:1.5px solid var(--linea);border-radius:10px;padding:11px 13px;
  font-size:16px;font-family:var(--body);background:var(--card2);color:var(--tinta)}
input:focus,button:focus-visible{outline:2.5px solid var(--rojo);outline-offset:1px}
.fila2{display:flex;gap:8px}
.fila2>*{flex:1}
/* fichas / anexos */
.ficha-item{border:1px solid var(--linea);border-radius:12px;margin:8px 0;overflow:hidden;background:var(--card);box-shadow:var(--sombra)}
.ficha-item>button{width:100%;background:none;border:0;padding:13px 14px;display:flex;align-items:center;gap:11px;
  cursor:pointer;text-align:left;font-size:15.5px;font-weight:600;color:var(--tinta)}
.ficha-item>button .ic{flex:none;width:36px;height:36px;border-radius:10px;background:rgba(127,209,166,.12);color:var(--verde-cl);
  display:flex;align-items:center;justify-content:center}
.ficha-item>button .fl{font-family:var(--disp);font-weight:700;letter-spacing:.3px;text-transform:uppercase;font-size:16.5px}
.ficha-item>button .fs{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--sub);text-transform:none;letter-spacing:0}
.ficha-item>button .flecha{margin-left:auto;color:var(--sub);transition:transform .2s}
.ficha-item.open>button .flecha{transform:rotate(90deg)}
.ficha-body{display:none;padding:0 14px 14px;border-top:1px solid var(--linea)}
.ficha-item.open .ficha-body{display:block}
.dosis{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}
.dosis span{background:rgba(127,209,166,.16);color:var(--verde-cl);font-family:var(--disp);font-weight:700;font-size:13px;
  letter-spacing:.4px;border-radius:6px;padding:3px 9px;text-transform:uppercase}
.ej{padding:9px 0;border-top:1px dashed var(--linea);font-size:14.5px;display:flex;gap:11px;align-items:center}
.ej:first-of-type{border-top:0}
.ej .ico{flex:none;width:72px;height:50px;background:var(--card2);border-radius:9px;display:flex;align-items:center;justify-content:center}
.ej .ico svg{width:68px;height:46px}
.ej .et{flex:1;color:var(--sub);font-size:13.5px}
.ej .et>b{display:block;color:var(--tinta);font-size:14.5px}
.ficha-body img{width:100%;border-radius:10px;margin:8px 0;border:1px solid var(--linea)}
.avlink{color:var(--verde-osc);font-weight:600}
/* modal cronómetro */
.overlay{position:fixed;inset:0;background:rgba(20,40,30,.55);z-index:90;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.modal h3{margin-bottom:2px}
.crono-fase{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.5px;text-transform:uppercase;
  text-align:center;margin-top:12px;color:var(--verde-osc)}
.crono-fase.trabajo{color:var(--rojo)}
.crono-t{font-family:var(--disp);font-weight:800;font-size:88px;line-height:1;text-align:center;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.crono-sub{text-align:center;color:var(--sub);font-size:14px;min-height:20px}
.crono-btns{display:flex;gap:10px;margin-top:16px}
.crono-btns .btn{flex:1;padding:13px}
/* varios */
.aviso{background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.3);border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
.ok-msg{background:var(--card2);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
.centrado{text-align:center}
.mt{margin-top:12px}.mt8{margin-top:8px}
.oculto{display:none!important}
.dia-fila{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--linea);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-size:15px;font-family:var(--body)}
.dia-fila .df-num{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--verde-osc);width:34px;text-align:center;flex:none}
.dia-fila .df-t{flex:1}
.dia-fila .df-t small{display:block;color:var(--sub)}
.dia-fila .df-est{display:flex;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--card2);border:1.5px solid var(--linea)}
.dot.ok{background:var(--verde-cl);border-color:var(--verde-cl);box-shadow:0 0 0 3px rgba(127,209,166,.16)}
.dot.med{background:var(--ambar);border-color:var(--ambar)}
.dot.pend{background:transparent;border:1.5px dashed var(--rojo)}
.semana-hd{display:flex;align-items:center;gap:8px;margin-top:18px}
.semana-hd h3{flex:1}
footer{margin:26px 0 8px;text-align:center;color:var(--sub);font-size:12.5px}
.pasos{counter-reset:p}
.paso{display:flex;gap:11px;padding:10px 0;border-top:1px dashed var(--linea);font-size:14.5px}
.paso:first-child{border-top:0}
.paso:before{counter-increment:p;content:counter(p);flex:none;width:26px;height:26px;border-radius:50%;
  background:var(--verde);color:#fff;font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.progreso-test{height:5px;background:var(--card2);border-radius:3px;margin:10px 0 16px}
.progreso-test div{height:100%;background:var(--rojo);border-radius:3px;transition:width .3s}
</style>
</head>

 NUTRI:{n:'Alimentación e hidratación',ic:'🍽️',sub:'Adaptado al calor de agosto',
   dosis:[],
   ejercicios:[
    ['Hidratación diaria','Con calor, las necesidades suben bastante por encima de lo habitual. Bebe a lo largo del día, no solo al entrenar. Referencia sencilla: la orina debe ser clara. Si es oscura, vas corta.'],
    ['Antes de entrenar','Unos 400-500 ml de agua en la hora previa. Si la sesión es intensa, una comida ligera rica en hidratos 1-2 horas antes (fruta, tostada, yogur). Evita empezar en ayunas las sesiones de intensidad alta.'],
    ['Durante la sesión','Bebe pequeñas cantidades cada 15-20 minutos. En sesiones largas con mucho calor y sudoración, el agua con algo de sal y algún hidrato (bebida deportiva o agua con una pizca de sal y zumo) repone mejor que el agua sola.'],
    ['Después de entrenar','Repón líquido hasta recuperar el color claro de la orina. En la hora siguiente, combina hidratos y proteína: es la ventana en la que mejor se recupera el músculo y se rellenan los depósitos.'],
    ['Estructura del día','Prioriza en cada comida: una fuente de proteína (huevo, pescado, carne, legumbre, lácteo), hidratos de carbono según la actividad del día, verdura o fruta, y grasas de calidad (aceite de oliva, frutos secos).'],
    ['Trabajo excéntrico y agujetas','Los días de trabajo excéntrico, no reduzcas la ingesta de proteína: es cuando más la necesitas para reparar. Repartirla entre las comidas funciona mejor que concentrarla en una sola.'],
    ['Descanso','Dormir 7-9 horas es el factor de recuperación con más impacto de todos, y en verano se descuida. Si trasnochas, prioriza acostarte antes los días previos a las sesiones de intensidad alta.'],
    ['Alcohol','Deshidrata, empeora el sueño y retrasa la recuperación muscular. Son vacaciones y cada una decide, pero conviene saber que una noche de alcohol condiciona la sesión de los dos días siguientes.'],
    ['Nada de dietas restrictivas','Agosto no es momento de recortar comida: estás entrenando para llegar en condiciones, no para perder peso. Si tienes dudas sobre tu alimentación, háblalo con nosotras y buscamos ayuda profesional.']],
   nota:'Esto son pautas generales de apoyo al entrenamiento, no una dieta. Cualquier situación particular (alergias, intolerancias, vegetarianismo, problemas digestivos o cualquier duda) merece asesoramiento individual: coméntanoslo.'},

    ['Banda elástica o mini-band','Para aducciones, monster walks y trabajo de cadera. <b>Sustitutos:</b> unas mallas viejas atadas, una goma de tela de las de gimnasio, o hacer el ejercicio sin resistencia añadiendo repeticiones.'],
    ['Carga externa (mancuernas, barra)','Para el circuito de fuerza y el peso muerto. <b>Sustitutos:</b> una mochila cargada con libros o botellas de agua, dos garrafas de 5 litros, o una bolsa de la compra bien cerrada. Ajusta el peso hasta acabar la serie pudiendo hacer 2-3 repeticiones más.'],
    ['Superficie elevada (cajón, banco)','Para step-up, isométricos de aductor y elevaciones. <b>Sustitutos:</b> un escalón del portal, un banco del parque, una silla robusta contra la pared o el bordillo de la acera.'],
    ['Rodillo de espuma','Para la liberación miofascial de la vuelta a la calma. <b>Sustitutos:</b> una botella de litro y medio llena y congelada, un rodillo de cocina con una toalla enrollada, o una pelota de tenis para la planta del pie y el glúteo.'],
    ['Toalla o deslizadores','Para el deslizamiento excéntrico de isquiosurales y el Y-balance. <b>Sustitutos:</b> dos trapos de cocina sobre suelo liso, dos calcetines gruesos, o dos bolsas de plástico. No funciona sobre moqueta ni césped.'],
    ['Pared libre','Para movilidad de tobillo, isometría de muñeca y trabajo reactivo de portera. Cualquier pared sin cuadros sirve.'],
    ['Pelota','Para el trabajo reactivo de portera y la liberación de la planta del pie. <b>Sustitutos:</b> pelota de tenis, de goma o incluso una de papel de aluminio bien prensada.'],
    ['Espacio de 20-30 metros','Para las aceleraciones progresivas y las lanzaderas. Un tramo de acera sin cruces, un parque o una pista vacía.'],
    ['Cuesta suave','Opcional pero muy recomendable: protege los isquiosurales en el trabajo intermitente. Cualquier calle en pendiente sirve.'],
    ['Cronómetro','Ya lo tienes: esta web lo lleva integrado en cada bloque que lo necesita.']],
   nota:'No hace falta comprar nada. Si te falta algo y no encuentras el sustituto, escríbelo en el grupo: seguro que alguna compañera lo ha resuelto ya.'},
 CONTEXTO:{n:'Adaptación del entorno',ic:'📍',sub:'Vacaciones, viaje o sin material',
   dosis:[],

    ['Sin material','La toalla sustituye a los deslizadores. Una mochila con libros sustituye a las pesas. Un escalón o un banco del parque sustituye al cajón. Una pared basta para movilidad de tobillo y reactividad.'],

    ['En piscina','Vale como día complementario. No sustituye a la carrera para la pretemporada, pero descarga y recupera muy bien.']]},
 CALOR:{n:'Entrenar con calor',ic:'☀️',sub:'Condiciones de agosto en Madrid',

 RECU:{n:'Recuperación y hábitos',ic:'🌙',sub:'Cuídate entre sesiones',

function actDelDia(f){
  const forzada=store.get('act_'+f,null);
  if(forzada!==null)return ACTIVACIONES.find(a=>a.id===forzada)||ACTIVACIONES[0];
  const idx=Object.keys(PLAN).indexOf(f);
  return ACTIVACIONES[(idx<0?0:idx)%ACTIVACIONES.length];
}
function abrirActivacion(f){
  const a=actDelDia(f);
  const otras=ACTIVACIONES.filter(x=>x.id!==a.id);
  abrirModal(`<h3>Activación · ${a.n}</h3><p class="sub">${a.dur} · ${a.desc}</p>
    <div style="max-height:52vh;overflow:auto;margin-top:8px">
      ${a.ej.map(e=>ejHTML([e[0],e[1]+' segundos'])).join('')}
    </div>
    <button class="btn verde btn-lg mt" onclick="cronoActivacion('${a.id}')">${ICONS.reloj} Guiar con cronómetro</button>
    <div class="acciones mt8">${otras.map(o=>`<button class="btn borde" onclick="store.set('act_${f}','${o.id}');abrirActivacion('${f}')">Cambiar a: ${o.n}</button>`).join('')}</div>
    <button class="btn gris btn-lg mt8" onclick="cerrarModal()">Volver a la sesión</button>`);
}
function cronoActivacion(id){
  const a=ACTIVACIONES.find(x=>x.id===id);
  crono.fases=[];
  a.ej.forEach((e,i)=>{
    crono.fases.push({t:e[0],s:e[1],tipo:'trabajo'});
    if(i<a.ej.length-1)crono.fases.push({t:'Cambio · '+a.ej[i+1][0],s:10,tipo:'rec'});
  });
  crono.i=0;crono.resto=crono.fases[0].s;crono.pausa=true;crono.nombre='Activación · '+a.n;
  clearInterval(crono.timer);
  pintarCrono();
}

/* ---------- CRONÓMETROS ---------- */
function fasesCC(series,minTrabajo,minRec,recTxt){
  const f=[];
  for(let i=1;i<=series;i++){
    f.push({t:'Carrera '+i+'/'+series,s:minTrabajo*60,tipo:'trabajo'});
    if(i<series&&minRec)f.push({t:recTxt||'Recupera',s:minRec*60,tipo:'rec'});
  }
  return f;
}
function fasesSIT(){
  const f=[];
  for(let s=1;s<=3;s++){
    for(let r=1;r<=9;r++){
      f.push({t:'SPRINT '+r+'/9 · serie '+s,s:15,tipo:'trabajo'});
      if(r<9)f.push({t:'Recupera',s:30,tipo:'rec'});
    }
    if(s<3)f.push({t:'Descanso entre series',s:180,tipo:'rec'});
  }
  return f;
}
function fasesInter(series,trab,rec,etq){
  const f=[];
  for(let i=1;i<=series;i++){
    f.push({t:etq+' '+i+'/'+series,s:trab,tipo:'trabajo'});
    if(i<series)f.push({t:'Camina y respira',s:rec,tipo:'rec'});
  }
  return f;
}
function fasesSprint(n,pct){
  const f=[];
  for(let i=1;i<=n;i++){
    f.push({t:'ACELERACIÓN '+i+'/'+n+' · '+pct,s:8,tipo:'trabajo'});
    if(i<n)f.push({t:'Recuperación completa caminando',s:90,tipo:'rec'});
  }
  return f;
}
function fasesSITcorto(){
  const f=[];
  for(let s=1;s<=2;s++){
    for(let r=1;r<=6;r++){
      f.push({t:'SPRINT '+r+'/6 · serie '+s,s:15,tipo:'trabajo'});
      if(r<6)f.push({t:'Recupera',s:30,tipo:'rec'});
    }
    if(s<2)f.push({t:'Descanso entre series',s:180,tipo:'rec'});
  }
  return f;
}
function fasesTabata(bloques){
  const f=[];
  for(let b=1;b<=bloques;b++){
    for(let s=1;s<=8;s++){
      f.push({t:'Bloque '+b+' · '+s+'/8',s:20,tipo:'trabajo'});
      if(s<8)f.push({t:'Descansa',s:10,tipo:'rec'});
    }
    if(b<bloques)f.push({t:'Cambio de bloque',s:60,tipo:'rec'});
  }
  return f;
}

function calcularPrev(resps){
  const pts={};for(const k in PREVS)pts[k]=0;
  TEST.forEach((p,i)=>{
    const r=resps[i];if(r===undefined)return;
    const sel=Array.isArray(r)?r:[r];
    sel.forEach(ix=>{const w=p.ops[ix][1];for(const k in w)pts[k]+=w[k];});
  });
  const orden=Object.keys(pts).map(Number).sort((a,b)=>{
    if(pts[b]!==pts[a])return pts[b]-pts[a];
    return ORDEN_DESEMPATE.indexOf(a)-ORDEN_DESEMPATE.indexOf(b);
  });
  if(pts[orden[0]]===0)return {a:8,b:2,limpio:true};
  let a=orden[0],b=orden[1];
  if(pts[b]===0)b=(a===8)?2:8; // solo 1 con puntos: completa con el combo base
  return {a,b,limpio:false};
}

function respTest(i,multi){
  if(multi){
    let sel=testResps[testPaso]||[];

      sel.includes(i)?sel=sel.filter(x=>x!==i):sel.push(i);}
    testResps[testPaso]=sel;

  render();

    if(acciones.length)extra=`<div class="acciones">${acciones.join('')}</div>`;
    html+=`<div class="bloque ${hecho?'hecho':''}">

/* ----- CRONÓMETRO ----- */
let crono={fases:[],i:0,resto:0,timer:null,pausa:true,wake:null};
let audioCtx=null;
function beep(fin){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=fin?660:880;g.gain.value=.25;
    o.start();o.stop(audioCtx.currentTime+(fin?.5:.18));
  }catch(e){}
}
function abrirCrono(key){
  const t=TIMERS[key];
  crono.fases=t.f();crono.i=0;crono.resto=crono.fases[0].s;crono.pausa=true;crono.nombre=t.n;
  clearInterval(crono.timer);
  pintarCrono();
}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function pintarCrono(){
  const f=crono.fases[crono.i];
  const sig=crono.fases[crono.i+1];
  abrirModal(`<h3>${ICONS.reloj} ${crono.nombre||''}</h3>
    <div class="crono-fase ${f.tipo}">${f.t}</div>
    <div class="crono-t" id="cronoT">${fmt(crono.resto)}</div>
    <div class="crono-sub" id="cronoSub">${sig?'Después: '+sig.t:'Última fase'}</div>
    <div class="crono-btns">
      <button class="btn ${crono.pausa?'verde':'gris'}" onclick="cronoToggle()">${crono.pausa?'▶ Empezar':'⏸ Pausa'}</button>
      <button class="btn gris" onclick="cronoSaltar()">Saltar fase</button>
      <button class="btn rojo" onclick="cerrarCrono()">Salir</button>
    </div>`,true);
}
function cronoToggle(){
  crono.pausa=!crono.pausa;
  if(!crono.pausa){
    if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>crono.wake=w).catch(()=>{});
    clearInterval(crono.timer);
    crono.timer=setInterval(tick,1000);
    beep(false);
  }else clearInterval(crono.timer);
  pintarCrono();
}
function tick(){
  crono.resto--;
  if(crono.resto<=0){
    if(crono.i>=crono.fases.length-1){
      beep(true);clearInterval(crono.timer);
      $('#cronoT').textContent='FIN';$('#cronoSub').textContent='¡Hecho! Márcalo en la sesión.';
      return;
    }
    crono.i++;crono.resto=crono.fases[crono.i].s;beep(false);
    crono.pausaKeep=true;pintarCronoVivo();return;
  }
  const el=$('#cronoT');if(el)el.textContent=fmt(crono.resto);
  if(crono.resto<=3)beep(false);
}
function pintarCronoVivo(){
  // repinta sin resetear intervalo
  const f=crono.fases[crono.i],sig=crono.fases[crono.i+1];
  const fase=$('#modalBody .crono-fase');
  if(fase){fase.textContent=f.t;fase.className='crono-fase '+f.tipo;}
  const t=$('#cronoT');if(t)t.textContent=fmt(crono.resto);
  const s=$('#cronoSub');if(s)s.textContent=sig?'Después: '+sig.t:'Última fase';
}
function cronoSaltar(){
  if(crono.i>=crono.fases.length-1)return;
  crono.i++;crono.resto=crono.fases[crono.i].s;
  crono.pausa?pintarCrono():pintarCronoVivo();
}
function cerrarCrono(){
  clearInterval(crono.timer);crono.pausa=true;
  if(crono.wake){crono.wake.release().catch(()=>{});crono.wake=null;}
  cerrarModal();
}

/* ----- modal ----- */
function abrirModal(html){
  $('#modalBody').innerHTML=html;
  $('#overlay').classList.add('on');
}
function cerrarModal(){$('#overlay').classList.remove('on')}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay'){clearInterval(crono.timer);crono.pausa=true;cerrarModal();}});

/* ----- nav ----- */
function marcarNav(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===vista));
}
document.querySelectorAll('#nav button').forEach(b=>{
  b.addEventListener('click',()=>{vista=b.dataset.v;marcarNav();render();});
});
function esPWA(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function sistema(){
  const u=navigator.userAgent||'';
  if(/iPad|iPhone|iPod/.test(u)&&!window.MSStream)return 'ios';
  if(/Android/.test(u))return 'android';
  return 'escritorio';
}
function navegadorInterno(){
  const u=navigator.userAgent||'';
  if(/FBAN|FBAV|Instagram|Line\/|Twitter/i.test(u))return true;
  if(sistema()==='android'&&/; wv\)/i.test(u))return true;   // WebView de apps
  return false;
}
function cardInstalar(){
  if(esPWA()||store.get('visto_instalar',false))return '';
  const s=sistema();
  const aviso=navegadorInterno()
    ? `<div class="aviso"><b>Ojo:</b> has abierto esto desde otra aplicación. Ábrelo en tu navegador (${s==='ios'?'Safari':'Chrome'}) o tu progreso podría no guardarse.<br>${s==='ios'?'Toca los tres puntos de arriba y elige “Abrir en Safari”.':'Toca los tres puntos de arriba y elige “Abrir en Chrome”.'}</div>`
    : '';
  const pasos = s==='ios'
    ? `<div class="paso"><span>Abre esta página en <b>Safari</b>.</span></div>
       <div class="paso"><span>Toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</span></div>
       <div class="paso"><span>Baja y elige <b>Añadir a pantalla de inicio</b>.</span></div>
       <div class="paso"><span>Pulsa <b>Añadir</b>. Ya la tienes con el escudo, como una app más.</span></div>`
    : s==='android'
    ? `<div class="paso"><span>Abre esta página en <b>Chrome</b>.</span></div>
       <div class="paso"><span>Toca los <b>tres puntos</b> de arriba a la derecha.</span></div>
       <div class="paso"><span>Elige <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</span></div>
       <div class="paso"><span>Confirma. Ya la tienes con el escudo, como una app más.</span></div>`
    : `<div class="paso"><span>Estás en un ordenador. Ábrela en el móvil, que es donde la vas a usar.</span></div>
       <div class="paso"><span>Guárdala en favoritos para tenerla a mano.</span></div>`;
  return `<div class="card" style="border-color:var(--verde)">
    <span class="tag">Recomendado</span>
    <h2 class="mt8">Guárdala en tu móvil</h2>
    <p class="mt8 sub">Se abre sin conexión y tu progreso se queda guardado. Son 10 segundos.</p>
    ${aviso}
    <div class="pasos mt8">${pasos}</div>
    <button class="btn gris btn-lg mt" onclick="store.set('visto_instalar',true);render()">Hecho, no volver a mostrar</button></div>`;
}
function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}

(function(){
  const ks=['hoy','plan','fichas','prev'];
  document.querySelectorAll('#nav .nvi').forEach((el,i)=>{el.innerHTML=ICONS[ks[i]];});
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
render();
</script>
